<style>
  @font-face { font-family: "Bellefair"; src: url("fonts/Bellefair-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Assistant"; src: url("fonts/Assistant-wght.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }
  :root {
    --night: #17111B; --plum: #221828; --plum-2: #2C2033; --line: rgba(242,214,170,.14);
    --wax: #F2E6D6; --smoke: #B9A79C; --amber: #E9B36A; --wine: #7A2A42; --rose: #D79A98;
    --glow: #E9B36A;
    --display: "Bellefair", "Assistant", serif; --body: "Assistant", system-ui, sans-serif;
  }
  :root[data-heat="candle"] { --glow: #F0CB8E; }
  :root[data-heat="ember"]  { --glow: #E9A05C; }
  :root[data-heat="flame"]  { --glow: #E5744F; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--night); }
  body { margin: 0; font-family: var(--body); color: var(--wax); font-size: 17px; line-height: 1.55;
    background: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--glow) 22%, transparent), transparent 60%), var(--night);
    background-attachment: fixed; min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; }
  p { margin: 0 0 .7em; } p:last-child { margin-bottom: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  a { color: var(--amber); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  /* Header: the candle */
  header { padding: calc(18px + env(safe-area-inset-top)) 0 6px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--display); font-size: 30px; line-height: 1; }
  .brand small { display: block; font-family: var(--body); font-size: 14px; color: var(--smoke); margin-top: 6px; }
  .weather { text-align: left; font-size: 14px; color: var(--smoke); }
  .weather b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--wax); line-height: 1; }
  .emblem { width: 48px; height: 45px; flex: none; color: var(--glow); filter: drop-shadow(0 0 9px color-mix(in srgb, var(--glow) 50%, transparent)); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Day picker */
  .days { display: flex; gap: 6px; margin: 18px 0 0; }

/* Opens the sealed app. The content of this site is encrypted (AES-GCM, key from PBKDF2-SHA256).

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));

  }

  }

  function saved() { try { const v = localStorage.getItem(KEY_STORE); return v ? b64(v).buffer : null; } catch (e) { return null; } }
  function ask() {
    document.body.classList.add("locked");
    const form = $("lockForm"), err = $("lockErr"), btn = $("lockBtn"), input = $("lockPass");
    if (!window.crypto || !crypto.subtle) { err.textContent = "הדפדפן הזה לא יכול לפתוח את האפליקציה. פתחו אותה מהכתובת המאובטחת (https)."; btn.disabled = true; return; }
    input.focus();
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); if (!input.value) return;
      btn.disabled = true; err.textContent = ""; btn.textContent = "פותח...";
      try { const raw = await keyFromWord(input.value.trim()); const code = await open(raw); remember(raw); run(code); }
